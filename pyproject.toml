[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-valuation"
version = "0.1.0"
description = "Public portfolio excerpt: guided manual Excel valuation workflow support"
requires-python = ">=3.11"
dependencies = ["html5lib==1.1", "six==1.17.0", "webencodings==0.5.1", "openpyxl==3.1.5"]

[project.scripts]
valuation = "airline_valuation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
